<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneFeed Promo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; }
      body { color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      main { display: flex; width: 440px; height: 280px; align-items: center; gap: 26px; padding: 38px 42px; background: radial-gradient(circle at 78% 18%, #343092 0, transparent 38%), linear-gradient(135deg, #0b0f19, #12182a); }
      img { width: 100px; height: 100px; border-radius: 24px; filter: drop-shadow(0 16px 28px rgba(99, 102, 241, .4)); }
      strong { display: block; font: 700 27px/1.1 Georgia, serif; letter-spacing: .02em; }
      p { margin: 12px 0 0; color: #cbd5e1; font-size: 14px; line-height: 1.55; }
      span { color: #a5b4fc; }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.png" alt="" />
      <div><strong>OneFeed</strong><p>把不同平台的信息流，变成<br /><span>专注、统一的阅读体验</span></p></div>
    </main>
  </body>
</html>
