<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneFeed — Focus Paper</title>
    <style>
      :root {
        --paper: #f4f7fb;
        --ink: #172033;
        --muted: #6f7c91;
        --line: #dde4ee;
        --blue: #1769e0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      .app { position: relative; width: 960px; margin: 0 auto; padding: 0 72px 64px 112px; }
      header { display: flex; min-height: 104px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
      .brand { display: flex; align-items: center; gap: 13px; }
      .brand img { width: 38px; height: 38px; border-radius: 9px; }
      .brand strong, .brand small { display: block; }
      .brand strong { font: 650 15px/1.25 Georgia, serif; letter-spacing: .035em; }
      .brand small { margin-top: 4px; color: var(--muted); font-size: 11px; letter-spacing: .14em; }
      .actions { display: flex; align-items: center; gap: 18px; color: var(--muted); font-size: 12px; }
      .dot { display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: #2cab67; box-shadow: 0 0 0 4px #dff4e8; }
      .exit { padding: 7px 11px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--muted); }
      .rail { position: fixed; top: 144px; width: 26px; margin-left: -68px; color: var(--muted); text-align: center; font: 600 9px/1 Consolas, monospace; letter-spacing: .16em; }
      .rail-label { writing-mode: vertical-rl; }
      .rail-track { display: block; width: 2px; height: 260px; margin: 12px auto; background: var(--line); }
      .rail-track i { display: block; width: 100%; height: 34%; background: var(--blue); }
      .rail-percent { display: block; letter-spacing: 0; transform: rotate(-90deg); }
      article { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 22px; padding: 42px 0 46px; border-bottom: 1px solid var(--line); }
      .index { padding-top: 3px; color: #9aa8bb; font: 500 11px/1.4 Consolas, monospace; letter-spacing: .08em; }
      .author { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
      .avatar { display: grid; width: 32px; height: 32px; place-items: center; border-radius: 50%; background: #e6f0ff; color: var(--blue); font: 600 13px serif; }
      .author strong, .author span { display: block; }
      .author strong { font-size: 13px; }
      .author span { margin-top: 3px; color: var(--muted); font-size: 10px; letter-spacing: .1em; }
      h2 { margin: 0 0 14px; font: 700 28px/1.38 "Songti SC", SimSun, Georgia, serif; }
      .content { color: #374257; font: 16px/1.95 "Songti SC", SimSun, Georgia, serif; }
      .actions-row { display: flex; gap: 24px; margin-top: 22px; color: var(--muted); font-size: 12px; }
      .actions-row span:last-child { margin-left: auto; color: var(--blue); }
      .notice { position: fixed; right: 24px; bottom: 20px; color: #8c98aa; font-size: 10px; letter-spacing: .05em; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="rail" aria-hidden="true">
        <span class="rail-label">READ</span>
        <span class="rail-track"><i></i></span>
        <span class="rail-percent">34%</span>
      </div>
      <header>
        <div class="brand">
          <img src="logo.svg" alt="" />
          <span><strong>OneFeed</strong><small>统一信息流 · 专注阅读</small></span>
        </div>
        <div class="actions"><span><i class="dot"></i>已整理 12 条内容</span><span class="exit">查看原页面</span></div>
      </header>
      <main>
        <article>
          <div class="index">01</div>
          <div>
            <div class="author"><div class="avatar">林</div><span><strong>林一</strong><span>来自知乎</span></span></div>
            <h2>如何在信息过载的时代保持专注？</h2>
            <div class="content">先把信息变少，再把真正重要的内容留下。统一的排版、克制的视觉层级和清晰的阅读节奏，可以减少在不同平台之间切换时产生的注意力损耗。</div>
            <div class="actions-row"><span>△ 赞同 1280</span><span>评论 86</span><span>查看原文 ↗</span></div>
          </div>
        </article>
        <article>
          <div class="index">02</div>
          <div>
            <div class="author"><div class="avatar">周</div><span><strong>周末读书</strong><span>来自知乎</span></span></div>
            <h2>一个更安静的信息流，应该是什么样子？</h2>
            <div class="content">保留内容和必要交互，移除重复装饰与无关干扰。OneFeed 在当前页面中完成整理，并允许你随时返回原始页面。</div>
            <div class="actions-row"><span>△ 赞同 642</span><span>评论 41</span><span>查看原文 ↗</span></div>
          </div>
        </article>
      </main>
    </div>
    <div class="notice">演示内容 · 不含真实用户数据</div>
  </body>
</html>
