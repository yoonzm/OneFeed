<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <!-- 毛玻璃发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 深色底座 -->
  <rect width="512" height="512" rx="120" fill="url(#glassBg)" />

  <!-- 背后隐约的发光柔晕 -->
  <circle cx="256" cy="256" r="120" fill="#6366F1" opacity="0.25" filter="url(#glow)" />

  <!-- 悬浮的主卡片层 (1号位) -->
  <g transform="translate(116, 136)">
    <!-- 底层倾斜半透明卡片 (暗示来自各平台的杂乱数据) -->
    <rect x="20" y="40" width="240" height="150" rx="20" fill="#1E293B" opacity="0.6" transform="rotate(-6 140 115)" stroke="#334155" stroke-width="2" />
    <rect x="20" y="-10" width="240" height="150" rx="20" fill="#1E293B" opacity="0.4" transform="rotate(8 140 65)" stroke="#334155" stroke-width="2" />

    <!-- 顶层统一的透明发光卡片 (OneFeed 引擎处理后的成果) -->
    <rect x="0" y="20" width="280" height="180" rx="24" fill="url(#cardGrad1)" filter="url(#glow)" opacity="0.9" />

    <!-- 极简内容骨架线条 -->
    <rect x="36" y="50" width="48" height="48" rx="12" fill="#FFFFFF" opacity="0.9" />
    <rect x="100" y="56" width="120" height="14" rx="7" fill="#FFFFFF" opacity="0.95" />
    <rect x="100" y="80" width="70" height="10" rx="5" fill="#FFFFFF" opacity="0.6" />

    <rect x="36" y="120" width="208" height="10" rx="5" fill="#FFFFFF" opacity="0.8" />
    <rect x="36" y="140" width="150" height="10" rx="5" fill="#FFFFFF" opacity="0.5" />
  </g>
</svg>
